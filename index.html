<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Experimento - Fixed e Sticky</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

        /* EXERCÍCIO A: Navbar fixa no topo da janela */
        .navbar {
            background-color: #111;
            color: #fff;
            padding: 1rem;
            width: 100%;

            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .header-space {
            /* Espaçamento para o conteúdo não ficar escondido atrás da navbar */
            height: 60px;
        }

        .hero {
            background-color: #ddd;
            padding: 3rem 1rem;
            text-align: center;
        }

        /* EXERCÍCIO B: Barra de aviso grudada abaixo da Navbar */
        .aviso-sticky {
            background-color: #ff0;
            color: #000;
            padding: 0.8rem;
            text-align: center;
            font-weight: bold;

            position: sticky;
            top: 60px;
            z-index: 999;
        }

        .conteudo {
            height: 200vh;
            /* Altura grande para permitir rolagem da página */
            padding: 2rem;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>Meu Site - Menu de Navegação</h2>
    </nav>

    <div class="header-space"></div>

    <header class="hero">
        <h1>Bem-vindo ao nosso site!</h1>
        <p>Role a página para testar os efeitos de posicionamento.</p>
    </header>

    <div class="aviso-sticky">
        ⚡ Aproveite! Frete grátis para compras acima de R$ 100!
    </div>

    <main class="conteudo">
        <h3>Conteúdo da Página</h3>
        <p>Role para baixo...</p>
    </main>

</body>

</html>
```
